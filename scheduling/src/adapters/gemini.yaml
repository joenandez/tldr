name: gemini
version: 1

command:
  argv: [gemini, --prompt, "{{prompt}}"]
  env: {}

session_id:
  capture:
    strategy: sidecar_diff
    snapshot:
      argv: [gemini, --list-sessions, --json]
      id_path: $[*].id

resume:
  command: "gemini --resume {{session_id}}"
  cwd: "{{job.cwd}}"
  caveats: ["same-machine, same-cwd"]
