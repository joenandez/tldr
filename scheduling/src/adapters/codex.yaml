name: codex
version: 1

# never-wait 5.2: the run host drives `codex app-server` and owns its stdin, so
# the prompt goes there. `--approval-policy never` is plain `codex exec`'s own
# policy; the sandbox stays the configured one (Helm never bypasses by default).
command:
  argv:
    [
      "{{node}}",
      "{{run_host}}",
      --runtime,
      codex,
      --approval-policy,
      never,
      --,
      codex,
      app-server,
    ]
  stdin: "{{prompt}}"
  env: {}

session_id:
  capture:
    strategy: stdout_parse
    from: stdout
    parse: jsonl
    match: { type: thread.started }
    path: $.thread_id

resume:
  command: "codex resume {{session_id}}"
  cwd: "{{job.cwd}}"
  caveats: ["cwd-scoped"]
